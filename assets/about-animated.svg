<svg width="800" height="300" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .label { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; fill: #c9d1d9; }
    .title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; fill: #58a6ff; font-weight: 700; }
    .pct { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8b949e; font-size: 12px; }
    .pill { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 700; font-size: 13px; }
    .track { fill: #21262d; }
  </style>

  <text x="40" y="42" class="title" font-size="22">About me</text>

  <g>
    <clipPath id="typeClip">
      <rect x="40" y="55" width="0" height="26">
        <animate attributeName="width" values="0;430;430;0;0" keyTimes="0;0.28;0.5;0.55;1" dur="6s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <text x="40" y="75" class="label" font-size="20" clip-path="url(#typeClip)">Frontend developer from Indonesia</text>
    <rect x="40" y="58" width="3" height="20" fill="#58a6ff">
      <animate attributeName="x" values="40;470;40" keyTimes="0;0.5;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1;0;1;0;1;0" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g transform="translate(40,105)">
    <rect x="0" y="0" width="70" height="28" rx="14" fill="#e34f26">
      <animate attributeName="opacity" values="1;0.6;1" dur="2s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <text x="35" y="19" text-anchor="middle" class="pill" fill="#ffffff">HTML</text>

    <rect x="78" y="0" width="60" height="28" rx="14" fill="#264de4">
      <animate attributeName="opacity" values="1;0.6;1" dur="2s" begin="0.3s" repeatCount="indefinite"/>
    </rect>
    <text x="108" y="19" text-anchor="middle" class="pill" fill="#ffffff">CSS</text>

    <rect x="146" y="0" width="55" height="28" rx="14" fill="#f0db4f">
      <animate attributeName="opacity" values="1;0.6;1" dur="2s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
    <text x="173" y="19" text-anchor="middle" class="pill" fill="#0d1117">JS</text>

    <rect x="209" y="0" width="80" height="28" rx="14" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.6;1" dur="2s" begin="0.9s" repeatCount="indefinite"/>
    </rect>
    <text x="249" y="19" text-anchor="middle" class="pill" fill="#0d1117">Tailwind</text>

    <rect x="297" y="0" width="60" height="28" rx="14" fill="#777bb4">
      <animate attributeName="opacity" values="1;0.6;1" dur="2s" begin="1.2s" repeatCount="indefinite"/>
    </rect>
    <text x="327" y="19" text-anchor="middle" class="pill" fill="#ffffff">PHP</text>
  </g>

  <g transform="translate(40,160)">
    <text x="0" y="0" class="label" font-size="14">Skill focus</text>

    <text x="0" y="30" class="pct">HTML</text>
    <rect x="90" y="20" width="300" height="10" rx="5" class="track"/>
    <rect x="90" y="20" height="10" rx="5" fill="#e34f26" width="0">
      <animate attributeName="width" from="0" to="270" begin="0.2s" dur="1.4s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>

    <text x="0" y="55" class="pct">CSS</text>
    <rect x="90" y="45" width="300" height="10" rx="5" class="track"/>
    <rect x="90" y="45" height="10" rx="5" fill="#264de4" width="0">
      <animate attributeName="width" from="0" to="255" begin="0.4s" dur="1.4s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>

    <text x="0" y="80" class="pct">JavaScript</text>
    <rect x="90" y="70" width="300" height="10" rx="5" class="track"/>
    <rect x="90" y="70" height="10" rx="5" fill="#f0db4f" width="0">
      <animate attributeName="width" from="0" to="225" begin="0.6s" dur="1.4s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>

    <text x="0" y="105" class="pct">Tailwind</text>
    <rect x="90" y="95" width="300" height="10" rx="5" class="track"/>
    <rect x="90" y="95" height="10" rx="5" fill="#38bdf8" width="0">
      <animate attributeName="width" from="0" to="240" begin="0.8s" dur="1.4s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>

    <text x="0" y="130" class="pct">PHP</text>
    <rect x="90" y="120" width="300" height="10" rx="5" class="track"/>
    <rect x="90" y="120" height="10" rx="5" fill="#777bb4" width="0">
      <animate attributeName="width" from="0" to="210" begin="1s" dur="1.4s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
  </g>
</svg>
